map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=hub_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8080 default_server;
    server_name localhost;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        return 302 http://platform.localhost:8080$request_uri;
    }
}

server {
    listen 8080;
    server_name platform.localhost;

    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # Preserve :8080 in the explicit HTTP development environment so Hub
        # OAuth callbacks and per-user full_url values use the browser origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8080;
    server_name hub.localhost *.hub.localhost;

    client_max_body_size 2g;

    # Browser-visible OAuth authorization. Token exchange uses the internal control network.
    location ^~ /hub/api/oauth2/authorize {
        access_log off;
        proxy_pass http://jupyterhub:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public mutation/API surfaces are not part of the portal contract.
    location ^~ /hub/api/ {
        return 404;
    }

    # NativeAuthenticator owns the password form. The portal links only to the
    # self-service route; per-user admin password routes stay outside the public
    # contract.
    location = /hub/change-password {
        limit_except GET POST {
            deny all;
        }
        limit_req zone=hub_login burst=5 nodelay;
        proxy_pass http://jupyterhub:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /hub/change-password/ {
        return 404;
    }

    location = /hub/spawn {
        return 303 http://platform.localhost:8080/;
    }

    location ~ ^/hub/(spawn|token|admin)(/|$) {
        return 404;
    }

    location ~ ^/hub/(login|signup)(/|$) {
        limit_req zone=hub_login burst=5 nodelay;
        proxy_pass http://jupyterhub:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://jupyterhub:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
