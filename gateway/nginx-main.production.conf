worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" request_id=$request_id';
    # OAuth codes, state, PKCE challenges, and encoded `next` targets must not
    # enter edge logs. Sensitive locations select this query-free format while
    # retaining source, method, path, status, and request correlation.
    log_format safe_path '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent request_id=$request_id';
    access_log /var/log/nginx/access.log main;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    keepalive_timeout 75s;
    client_header_timeout 15s;
    client_body_timeout 3600s;
    send_timeout 3600s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:platform_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}
