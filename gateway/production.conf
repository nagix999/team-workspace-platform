map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_host $hub_authority_allowed {
    default 0;
    __HUB_HOST__ 1;
    "~^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.__USER_DOMAIN_REGEX__$" 1;
}

map $ssl_server_name $hub_sni_allowed {
    default 0;
    __HUB_HOST__ 1;
    "~^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.__USER_DOMAIN_REGEX__$" 1;
}

# Generated before nginx -t from the required read-only CIDR source. It defines
# $platform_ingress_allowed with default 0, so rewrite-phase return locations
# cannot accidentally bypass the source allowlist.
include /tmp/company-vpn-allowlist.conf;

limit_req_zone $binary_remote_addr zone=hub_login:10m rate=10r/m;
limit_req_status 429;

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    access_log off;

    location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
    }

    location / {
        return 404;
    }
}

server {
    listen 3030 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 3030 ssl;
    http2 on;
    server_name __PORTAL_HOST__;

    ssl_certificate /run/platform-tls/tls.crt;
    ssl_certificate_key /run/platform-tls/tls.key;
    client_max_body_size 64m;

    add_header Strict-Transport-Security 'max-age=31536000' always;

    if ($platform_ingress_allowed = 0) { return 444; }
    if ($http_host != __PORTAL_HOST__) { return 421; }
    if ($ssl_server_name != $host) { return 421; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    # OAuth authorization codes and state values are query credentials. Keep
    # the callback path observable but never write its query string to logs.
    location = /api/v1/auth/callback {
        access_log /var/log/nginx/access.log safe_path;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://api:8000;
        include /etc/nginx/includes/proxy-https.conf;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        include /etc/nginx/includes/proxy-https.conf;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://frontend:8080;
        include /etc/nginx/includes/proxy-https.conf;
    }
}

server {
    listen 3030 ssl;
    http2 on;
    server_name __HUB_HOST__ *.__USER_DOMAIN__;

    ssl_certificate /run/platform-tls/tls.crt;
    ssl_certificate_key /run/platform-tls/tls.key;
    client_max_body_size 2g;

    add_header Strict-Transport-Security 'max-age=31536000' always;

    if ($platform_ingress_allowed = 0) { return 444; }
    if ($hub_authority_allowed = 0) { return 421; }
    if ($hub_sni_allowed = 0) { return 421; }
    if ($ssl_server_name != $host) { return 421; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location = /hub/api/oauth2/authorize {
        access_log /var/log/nginx/access.log safe_path;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://jupyterhub:8000;
        include /etc/nginx/includes/proxy-https.conf;
    }

    location ^~ /hub/api/ {
        return 404;
    }

    # Password fields go straight to NativeAuthenticator and never cross the
    # portal/API process. Only the logged-in user's self-service endpoint is
    # public; the per-user administrator variant remains blocked.
    location = /hub/change-password {
        limit_except GET POST {
            deny all;
        }
        access_log /var/log/nginx/access.log safe_path;
        error_log /var/log/nginx/error.log crit;
        limit_req zone=hub_login burst=5 nodelay;
        proxy_pass http://jupyterhub:8000;
        include /etc/nginx/includes/proxy-https.conf;
        proxy_request_buffering off;
    }

    location ^~ /hub/change-password/ {
        return 404;
    }

    # Recover direct/stale Hub-login fallbacks without exposing the native
    # spawn UI.  Normal portal OAuth carries an explicit authorize `next` and
    # never uses this route.
    location = /hub/spawn {
        return 303 https://__PORTAL_HOST__/;
    }

    location ~ ^/hub/(spawn|token|admin)(/|$) {
        return 404;
    }

    location ~ ^/hub/(login|signup)(/|$) {
        access_log /var/log/nginx/access.log safe_path;
        error_log /var/log/nginx/error.log crit;
        limit_req zone=hub_login burst=5 nodelay;
        proxy_pass http://jupyterhub:8000;
        include /etc/nginx/includes/proxy-https.conf;
    }

    location ~ "^/user/[a-z][a-z0-9-]{0,31}/ws-[a-f0-9]{32}/oauth_callback$" {
        access_log /var/log/nginx/access.log safe_path;
        error_log /var/log/nginx/error.log crit;
        proxy_pass http://jupyterhub:8000;
        include /etc/nginx/includes/proxy-https.conf;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://jupyterhub:8000;
        include /etc/nginx/includes/proxy-https.conf;
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
