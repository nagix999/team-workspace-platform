# HTTPS/SNI/OAuth rehearsal only. Always combine with compose.yaml. It preserves
# the local data/profile/network exceptions but exposes only loopback TCP/443.
# It is deliberately not a production deployment file.

x-domain-test-backend-environment: &domain-test-backend-environment
  PLATFORM_PORTAL_ORIGIN: https://platform.workspace.test
  PLATFORM_INSECURE_LOCAL_DEV: "false"
  PLATFORM_DOMAIN_TEST: "true"
  PLATFORM_COOKIE_SECURE: "true"
  JUPYTERHUB_PUBLIC_URL: https://hub.workspace.test
  JUPYTERHUB_USER_DOMAIN: hub.workspace.test
  JUPYTERHUB_OAUTH_REDIRECT_URI: https://platform.workspace.test/api/v1/auth/callback

services:
  migrate:
    environment: *domain-test-backend-environment

  bootstrap-profile:
    environment: *domain-test-backend-environment

  api:
    environment:
      <<: *domain-test-backend-environment
      # Uvicorn may honor forwarding headers only from this exact gateway
      # address. Client-provided X-Forwarded-* headers are reset by Nginx.
      FORWARDED_ALLOW_IPS: 172.28.0.10

  worker:
    environment: *domain-test-backend-environment

  jupyterhub:
    environment:
      PLATFORM_ENV: domain-test
      ALLOW_UNSAFE_LOCAL_DEV: "false"
      ALLOW_UNSAFE_DOMAIN_TEST: "true"
      JUPYTERHUB_SUBDOMAIN_HOST: https://hub.workspace.test
      PLATFORM_OAUTH_REDIRECT_URI: https://platform.workspace.test/api/v1/auth/callback
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/hub/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile.production
      args:
        GATEWAY_BASE_IMAGE: nginx:1.30.4-alpine
        ALLOW_MUTABLE_BASE_IMAGE: "true"
        GATEWAY_SERVER_CONFIG: domain-test.conf
    image: team-platform-gateway:domain-test
    # Replace the local HTTP publish instead of merging with it. A domain-test
    # gateway must expose only loopback TLS/443.
    ports: !override
      - 127.0.0.1:443:3030
    volumes:
      - type: bind
        source: ${DOMAIN_TEST_TLS_CERT_FILE:-./secrets/domain-test/tls.crt}
        target: /run/platform-tls/tls.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DOMAIN_TEST_TLS_KEY_FILE:-./secrets/domain-test/tls.key}
        target: /run/platform-tls/tls.key
        read_only: true
        bind:
          create_host_path: false
    group_add:
      - ${DOMAIN_TEST_TLS_GID:?Set DOMAIN_TEST_TLS_GID to the read-only certificate group GID}
    environment:
      PLATFORM_GATEWAY_MODE: domain-test
      PLATFORM_TLS_MIN_VALIDITY_SECONDS: "3600"
    networks:
      edge:
        ipv4_address: 172.28.0.10
      ingress: {}

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
