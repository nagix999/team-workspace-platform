# Forward-only package/Git proxy. The allowlist file is mounted read-only.
http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl manager proto cache_object

# Resolve destination addresses and reject internal, link-local, metadata, and
# non-global IPv4/IPv6 ranges even when an approved hostname DNS-rebinds.
acl forbidden_destination dst \
    0.0.0.0/8 \
    10.0.0.0/8 \
    100.64.0.0/10 \
    127.0.0.0/8 \
    169.254.0.0/16 \
    172.16.0.0/12 \
    192.0.0.0/24 \
    192.0.2.0/24 \
    192.168.0.0/16 \
    198.18.0.0/15 \
    198.51.100.0/24 \
    203.0.113.0/24 \
    224.0.0.0/4 \
    240.0.0.0/4 \
    ::/128 \
    ::1/128 \
    fc00::/7 \
    fe80::/10 \
    ff00::/8 \
    2001:db8::/32

acl approved_domains dstdomain "/etc/squid/approved-domains.txt"

http_access deny manager
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny forbidden_destination
http_access allow approved_domains
http_access deny all

# No disk cache or request bodies on persistent storage.
cache deny all
cache_store_log none
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /tmp/squid.pid
coredump_dir /tmp
pinger_enable off

# Reduce forwarding metadata. This proxy is not a DLP boundary; approved uploads
# remain possible and are an explicitly documented residual risk.
forwarded_for delete
via off
request_header_access X-Forwarded-For deny all
request_header_access Via deny all

shutdown_lifetime 3 seconds
visible_hostname platform-egress-proxy
